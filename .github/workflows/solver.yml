name: Daily solver

on:
  schedule:
    # 00:47 and 12:47 UTC = 09:47 and 21:47 JST. GitHub only runs schedules best-effort (runs were 6+ hours late,
    # and can be dropped under load), so the second slot is a retry; `play --submit` skips if today's score exists.
    # Odd minute to avoid the busy start of the hour.
    - cron: "47 0,12 * * *"
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the score to the leaderboard
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-solver

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: solver
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver
      - run: cargo build --release --locked
      - name: Play today's daily
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Scheduled runs always submit; manual runs only when asked.
          SUBMIT: ${{ github.event_name == 'schedule' || inputs.submit }}
        run: |
          args=(play --history-prior)
          if [ "$SUBMIT" = "true" ]; then args+=(--submit --username botaku); fi
          ./target/release/anime-wordle-solver "${args[@]}"
